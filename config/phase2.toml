# Phase 2 Sequential baseline configuration.
#
# This phase consumes the frozen Phase 1 artifacts and asks the local LLM to
# rank each 20-item candidate set using ONLY the chronological purchased-item
# history. Reviews, ratings, profiles, and the ground-truth marker are never
# shown to the model.

[input]
items_path = "outputs/phase1/items.jsonl.gz"
interactions_path = "outputs/phase1/interactions.jsonl.gz"
sessions_path = "outputs/phase1/sessions.jsonl.gz"

[experiment]
# The 3-session real-data pilot has passed with the numbered-candidate output
# protocol. Run every frozen Phase 1 session. Resume remains enabled so the
# three already-successful pilot sessions are skipped automatically.
max_sessions = 0
resume = true

# For the full 94-session run, continue past any malformed individual model
# output. Invalid sessions are logged as errors and are never included in NDCG.
# A run with any such errors finishes as INCOMPLETE and the failed sessions can
# be retried later because resume skips only status="ok" records.
fail_fast = false

[generation]
temperature = 0.0
max_tokens = 512
seed = 42

[output]
directory = "outputs/phase2_sequential"
