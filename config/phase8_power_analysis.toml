# Phase 8 prospective power analysis for a future NEW-USER confirmatory cohort.
#
# This phase never reruns the same 20 users and never changes frozen Phase 5/6/7
# results. It uses the Phase 7 user-level paired outcomes only as a pilot estimate
# of effect size and variance for study planning.

[input]
per_user_ndcg_csv = "outputs/phase7_final_analysis_v1/per_user_ndcg.csv"

[design]
expected_pilot_users = 20
alpha = 0.05
two_sided = true
powers = [0.80, 0.90]

# Pre-declared confirmatory primary endpoint. This was selected because the thesis
# analysis already identifies Recency-Focused as the strongest baseline and
# NDCG@10 as the main ranking-quality cutoff with the largest observed PURE gain.
# Phase 8 treats this as a planning target; it does not retroactively change the
# Phase 7 inferential result.
primary_baseline = "Recency-Focused"
primary_k = 10
primary_power = 0.80

# Pilot-derived sample-size estimates can be optimistic. We therefore also report
# a practical planning target with a 20% margin, rounded upward to 10 users.
safety_margin_fraction = 0.20
round_to_users = 10

# Fixed cohort sizes for sensitivity/power-curve reporting.
cohort_sizes = [20, 30, 40, 50, 60, 80, 100, 120, 150, 180, 200, 250, 300]

[output]
directory = "outputs/phase8_power_analysis_v1"
