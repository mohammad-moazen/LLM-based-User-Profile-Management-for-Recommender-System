# PURE Phase 4 full chronological Profile Updater run.
#
# Consumes the homogeneous frozen Phase 3 Review Extractor artifact and builds
# one safe profile state after every required historical interaction. The full
# runner processes every successful extraction row; max_users/max_updates fields
# are not used for limiting this run.

[input]
extractions_path = "outputs/phase3_review_extractor_final_1024/extractions.jsonl"

[experiment]
fail_fast = true

[generation]
temperature = 0.0
max_tokens = 1024
seed = 42

[output]
directory = "outputs/phase4_profile_updater_final_v4"
