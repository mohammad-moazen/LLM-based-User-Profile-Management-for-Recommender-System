[input]
items_path = "outputs/phase1/items.jsonl.gz"
interactions_path = "outputs/phase1/interactions.jsonl.gz"
sessions_path = "outputs/phase9_confirmatory_cohort_v1/sessions.jsonl.gz"
profile_states_path = "outputs/phase10_confirmatory_profile_updater_v2/profile_states.jsonl"

[experiment]
max_sessions = 0
resume = true
# Operational continuation only: retain strict scoring/validation, but do not stop the
# remaining frozen cohort when one session has an unscorable structural model output.
# Failed sessions remain failures and are not repaired, imputed, or excluded here.
fail_fast = false

[generation]
temperature = 0.0
max_tokens = 512
seed = 42

[output]
directory = "outputs/phase10_confirmatory_pure_v1"
