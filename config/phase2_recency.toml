# Phase 2 Recency-Focused baseline configuration.
#
# This consumes the same frozen Phase 1 sessions and candidate sets as the
# Sequential baseline. The only recommender-prompt difference is explicit
# emphasis on the most recently purchased item (time step t-1), matching the
# Recency-Focused description in the PURE paper.

[input]
items_path = "outputs/phase1/items.jsonl.gz"
interactions_path = "outputs/phase1/interactions.jsonl.gz"
sessions_path = "outputs/phase1/sessions.jsonl.gz"

[experiment]
# The 3-session real-data pilot passed with complete valid rankings.
# Run every frozen Phase 1 session; resume skips already successful pilot rows.
max_sessions = 0
resume = true
fail_fast = false

[generation]
temperature = 0.0
max_tokens = 512
seed = 42

[output]
directory = "outputs/phase2_recency"
