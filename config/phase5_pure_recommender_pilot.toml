# PURE Phase 5 recommender pilot.
#
# The pilot consumes frozen Phase 1 sessions plus the frozen Phase 4 profile-state
# cache. For target position t, only the profile state after position t-1 is used.

[input]
items_path = "outputs/phase1/items.jsonl.gz"
interactions_path = "outputs/phase1/interactions.jsonl.gz"
sessions_path = "outputs/phase1/sessions.jsonl.gz"
profile_states_path = "outputs/phase4_profile_updater_final_v4/profile_states.jsonl"

[experiment]
# Deterministic pilot: first 6 frozen sessions. This validates state/session
# alignment, prompt serialization, structured ranking output, and NDCG plumbing.
max_sessions = 6
fail_fast = true

[generation]
temperature = 0.0
max_tokens = 512
seed = 42

[output]
directory = "outputs/phase5_pure_recommender_pilot"
