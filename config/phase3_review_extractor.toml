# Phase 3 PURE Review Extractor full-run configuration.
#
# Pilot v5 is accepted. The full run keeps the same evidence-backed schema,
# prompt, model/generation settings, grounding filter, runtime profile, and
# output directory. Resume reuses the 3 accepted pilot extractions and processes
# the remaining required historical reviews.

[input]
interactions_path = "outputs/phase1/interactions.jsonl.gz"
sessions_path = "outputs/phase1/sessions.jsonl.gz"

[experiment]
# 0 means every unique historical review required by the 94 frozen sessions.
max_extractions = 0
resume = true
# Continue past malformed/API/task failures so the run can finish and report all
# failures; a later resume run retries only tasks that are not already status=ok.
fail_fast = false

[generation]
temperature = 0.0
max_tokens = 512
seed = 42

[output]
directory = "outputs/phase3_review_extractor_v5"
