# Phase 3 PURE Review Extractor — clean homogeneous final-protocol rerun.
#
# The first clean-final attempt used max_tokens=512 and completed 133/134 tasks.
# One long structured response was malformed. A single-task diagnostic with the
# same model/prompt/schema/seed and max_tokens=1024 finished normally (`stop`),
# parsed successfully, and used 495 completion tokens. Because 495 is close to
# the former 512-token ceiling, the thesis-grade final artifact is regenerated
# from scratch with a 1024-token ceiling so every stored task uses one identical
# generation configuration.
#
# Historical v5 and final-attempt-1 directories are preserved for audit.

[input]
interactions_path = "outputs/phase1/interactions.jsonl.gz"
sessions_path = "outputs/phase1/sessions.jsonl.gz"

[experiment]
# 0 means every unique historical review required by the 94 frozen sessions.
max_extractions = 0
# Resume remains enabled only for interruption recovery inside this NEW output
# directory. Its first run is clean and starts from zero.
resume = true
# Continue past task/API/schema failures and report all failures at the end.
fail_fast = false

[generation]
temperature = 0.0
max_tokens = 1024
seed = 42

[output]
# Clean homogeneous final artifact. Do not overwrite:
# - outputs/phase3_review_extractor_v5/
# - outputs/phase3_review_extractor_final/
directory = "outputs/phase3_review_extractor_final_1024"
