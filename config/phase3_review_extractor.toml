# Phase 3 PURE Review Extractor — clean homogeneous final-protocol run.
#
# The historical v5 directory is preserved for audit. This configuration writes
# a new clean artifact so every one of the 134 required review extractions is
# generated under the same final prompt/schema/parser and the finalized runtime
# profile (Evaluation Batch 512 / Physical Batch 256 / Max Concurrent 1).

[input]
interactions_path = "outputs/phase1/interactions.jsonl.gz"
sessions_path = "outputs/phase1/sessions.jsonl.gz"

[experiment]
# 0 means every unique historical review required by the 94 frozen sessions.
max_extractions = 0
# Resume is kept on so an interrupted clean run can continue. The new output
# directory is initially empty, so the first run still generates all 134 tasks.
resume = true
# Continue past task/API/schema failures and report all failures at the end.
fail_fast = false

[generation]
temperature = 0.0
max_tokens = 512
seed = 42

[output]
# Do not overwrite the historical development artifact at
# outputs/phase3_review_extractor_v5/.
directory = "outputs/phase3_review_extractor_final"
