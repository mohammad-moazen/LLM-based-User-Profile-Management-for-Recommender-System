# PURE Phase 4 Profile Updater pilot v2 configuration.
#
# Pilot v2 keeps the same frozen Review Extractor source and runtime, but uses a
# retention-biased deletion policy after pilot v1 showed arbitrary removal of a
# unique non-conflicting entry. Coverage is broadened to two users and four
# chronological updates per user so removed strings can be audited explicitly.

[input]
extractions_path = "outputs/phase3_review_extractor_final_1024/extractions.jsonl"

[experiment]
max_users = 2
max_updates_per_user = 4
fail_fast = true

[generation]
temperature = 0.0
max_tokens = 1024
seed = 42

[output]
directory = "outputs/phase4_profile_updater_pilot_v2"
