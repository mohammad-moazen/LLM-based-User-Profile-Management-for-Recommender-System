# PURE Phase 4 Profile Updater pilot v4 configuration.
#
# Pilot v4 keeps the ID-only model output introduced in v3 and replaces the
# symmetric overlap guard with an information-preserving directional guard. A
# shorter overlap may be removed only when a retained/restored same-category
# entry strictly dominates it. Coverage is broadened to three users and five
# chronological updates per user.

[input]
extractions_path = "outputs/phase3_review_extractor_final_1024/extractions.jsonl"

[experiment]
max_users = 3
max_updates_per_user = 5
fail_fast = true

[generation]
temperature = 0.0
max_tokens = 1024
seed = 42

[output]
directory = "outputs/phase4_profile_updater_pilot_v4"
