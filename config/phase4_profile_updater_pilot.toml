# PURE Phase 4 Profile Updater pilot v3 configuration.
#
# Pilot v3 keeps the same frozen Review Extractor source and runtime. The model
# now returns stable entry IDs rather than copying long strings, and a
# deterministic retention guard restores omitted unique evidence unless a
# retained same-category entry has clear lexical overlap. Coverage remains two
# users and four chronological updates per user for direct comparison with v2.

[input]
extractions_path = "outputs/phase3_review_extractor_final_1024/extractions.jsonl"

[experiment]
max_users = 2
max_updates_per_user = 4
fail_fast = true

[generation]
temperature = 0.0
max_tokens = 1024
seed = 42

[output]
directory = "outputs/phase4_profile_updater_pilot_v3"
